<!DOCTYPE html>
<html class="dark" lang="es" id="htmlTag">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}ISFT 188 - Buscador de Alumnos DNI{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Variables de Tema Oscuro */
        html.dark {
            --bg-body: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.8);
            --glass-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(30, 41, 59, 0.9);
            --input-border: rgba(255, 255, 255, 0.2);
            --input-text: #f8fafc;
            --option-bg: #1e293b;
            --option-text: #f8fafc;
            --header-bg: rgba(15, 23, 42, 0.9);
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        /* Variables de Tema Claro */
        html.light {
            --bg-body: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.12);
            --input-bg: #ffffff;
            --input-border: rgba(0, 0, 0, 0.2);
            --input-text: #0f172a;
            --option-bg: #ffffff;
            --option-text: #0f172a;
            --header-bg: rgba(255, 255, 255, 0.95);
            --modal-bg: rgba(255, 255, 255, 0.98);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }

        input[type="text"], input[type="search"], select {
            color: var(--input-text) !important;
            background-color: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.8;
        }

        input[type="text"]:focus, select:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
            outline: none;
        }

        select option {
            background-color: var(--option-bg) !important;
            color: var(--option-text) !important;
            padding: 10px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--input-text) !important;
            -webkit-box-shadow: 0 0 0px 1000px var(--input-bg) inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .glass-modal {
            background: var(--modal-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.6);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Navbar / Header -->
    <header class="sticky top-0 z-30 border-b border-white/10 px-4 md:px-8 py-3 flex items-center justify-between" style="background: var(--header-bg); backdrop-filter: blur(16px);">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                <span class="material-symbols-outlined text-2xl">school</span>
            </div>
            <div>
                <span class="text-xs uppercase tracking-widest text-indigo-500 font-bold">Instituto Superior N° 188</span>
                <h1 class="text-lg font-black leading-tight">Sistema de Gestión Académica</h1>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <!-- Botón Conmutador de Modo Claro / Modo Oscuro -->
            <button 
                id="themeToggleBtn"
                onclick="toggleTheme()" 
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/30 text-xs font-bold text-indigo-500 hover:text-indigo-400 transition-all cursor-pointer shadow-sm"
                title="Cambiar Modo Claro / Oscuro"
            >
                <span class="material-symbols-outlined text-base" id="themeIcon">dark_mode</span>
                <span id="themeText">Modo Oscuro</span>
            </button>
        </div>
    </header>

    <!-- Main Body Container -->
    <main class="flex-1 p-4 md:p-6 max-w-[1440px] w-full mx-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-4 px-8 text-center text-xs text-slate-400 bg-slate-900/30">
        ISFT N° 188 — General Rodríguez • Prácticas Profesionalizantes III (2026)
    </footer>

    <script>
        function applyTheme(theme) {
            const htmlTag = document.getElementById('htmlTag');
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            if (theme === 'light') {
                htmlTag.classList.remove('dark');
                htmlTag.classList.add('light');
                themeIcon.innerText = 'light_mode';
                themeText.innerText = 'Modo Claro';
            } else {
                htmlTag.classList.remove('light');
                htmlTag.classList.add('dark');
                themeIcon.innerText = 'dark_mode';
                themeText.innerText = 'Modo Oscuro';
            }
            localStorage.setItem('isft188_theme', theme);
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem('isft188_theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('isft188_theme') || 'dark';
            applyTheme(savedTheme);
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
